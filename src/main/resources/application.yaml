spring:
  application:
    name: bonusbissen
  datasource:
    url: jdbc:postgresql://localhost:5432/${LOCAL_DB_NAME:bonusbissen}
    username: ${LOCAL_DB_USER:postgres}
    password: ${LOCAL_DB_PASSWORD:local-dev-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    sql-migration-prefix: ""
  mail:
    host: ${MAIL_HOST:smtp.mailgun.org}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # The app already gates real SMTP behind app.mail.enabled (LoggingEmailSender
      # otherwise); Boot's own indicator ignores that and always tries to authenticate.
      enabled: false

app:
  jwt:
    # ECDSA (ES256, P-256) keypair, required — no default. Values are base64-encoded
    # DER: private-key is PKCS8, public-key is X.509/SPKI. Generate with:
    #   openssl ecparam -genkey -name prime256v1 -noout -out ec-private.pem
    #   openssl pkcs8 -topk8 -nocrypt -in ec-private.pem -outform DER | base64 -w0
    #   openssl ec -in ec-private.pem -pubout -outform DER | base64 -w0
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    expiration-minutes: 480
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  uploads:
    dir: /var/lib/bonusbissen/uploads/rewards
  georef:
    # https://datos.gob.ar/georef. Disabled -> address stored as typed, city null.
    enabled: ${GEOREF_ENABLED:true}
    base-url: ${GEOREF_BASE_URL:https://apis.datos.gob.ar/georef/api}
  mail:
    # false -> LoggingEmailSender (no SMTP, links are logged). Set MAIL_ENABLED=true
    # plus the spring.mail.* settings above to actually send via Mailgun.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:bonusbissen <no-reply@bonusbissen.local>}
    # Frontend page that reads ?token= and POSTs it to /auth/verify-email
    verification-url: ${MAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
    token-ttl-hours: ${MAIL_TOKEN_TTL_HOURS:48}
  backup:
    # DR_BACKUP_* unset (local dev/test): the placeholder endpoint below keeps the
    # S3Client bean constructible; the nightly job just fails harmlessly at
    # upload time instead, caught by DatabaseBackupService#runScheduledBackup.
    cron: ${DR_BACKUP_CRON:0 0 5 * * *}
    s3:
      endpoint: ${DR_BACKUP_S3_ENDPOINT:localhost}
      bucket: ${DR_BACKUP_S3_BUCKET:unset}
      access-key: ${DR_BACKUP_S3_ACCESS_KEY:unset}
      secret-key: ${DR_BACKUP_S3_SECRET_KEY:unset}
