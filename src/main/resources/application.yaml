spring:
  application:
    name: bonusbissen
  datasource:
    url: jdbc:postgresql://localhost:5432/bonusbissen
    username: postgres
    password: ale36153171
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always
  mail:
    host: ${MAIL_HOST:smtp.mailgun.org}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-01234567890123456789xdxdxdxdxdddxd123dx213dx123xd123xd12x3d1x23dx1d23x1d23x1d23x}
    expiration-minutes: 480
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  uploads:
    dir: /var/lib/bonusbissen/uploads/rewards
  mail:
    # false -> LoggingEmailSender (no SMTP, links are logged). Set MAIL_ENABLED=true
    # plus the spring.mail.* settings above to actually send via Mailgun.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:bonusbissen <no-reply@bonusbissen.local>}
    # Frontend page that reads ?token= and POSTs it to /auth/verify-email
    verification-url: ${MAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
    token-ttl-hours: ${MAIL_TOKEN_TTL_HOURS:48}
