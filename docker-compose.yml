services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bonusbissen}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bonusbissen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bonusbissen}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      # Mail: leave MAIL_ENABLED=false (dev default) to skip SMTP entirely --
      # verification links are just logged. Set it to true in a real deploy and
      # provide the Mailgun SMTP settings below.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.mailgun.org}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-bonusbissen <no-reply@bonusbissen.local>}
      MAIL_VERIFICATION_URL: ${MAIL_VERIFICATION_URL:-http://localhost:3000/verify-email}
      DR_BACKUP_S3_ENDPOINT: ${DR_BACKUP_S3_ENDPOINT:-}
      DR_BACKUP_S3_BUCKET: ${DR_BACKUP_S3_BUCKET:-}
      DR_BACKUP_S3_ACCESS_KEY: ${DR_BACKUP_S3_ACCESS_KEY:-}
      DR_BACKUP_S3_SECRET_KEY: ${DR_BACKUP_S3_SECRET_KEY:-}
      DR_BACKUP_CRON: ${DR_BACKUP_CRON:-0 0 5 * * *}
    volumes:
      - uploads:/var/lib/bonusbissen/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      args:
        # Next.js inlines NEXT_PUBLIC_* vars at build time, not read at container
        # startup like everything below -- changing ASSETS_URL requires a real
        # rebuild (docker compose build frontend), a restart alone won't pick it up.
        NEXT_PUBLIC_ASSETS_URL: ${ASSETS_URL:-https://localhost/}
    container_name: frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      # Docker injects its own HOSTNAME (the container id) into every container;
      # Next's standalone server.js reads that same var for its bind address, so
      # without this override it silently binds to the container's own IP
      # instead of 0.0.0.0 -- works by luck via Docker DNS, breaks loopback
      # healthchecks and anything else hitting it directly.
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: http://backend:8080
      ASSETS_URL: ${ASSETS_URL:-https://localhost/}
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - uploads:/uploads:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      frontend:
        condition: service_healthy
      grafana:
        condition: service_started

  # Not started by `docker compose up`; invoked directly via
  # nginx/certbot-init.sh (issuance) and cron (renewal). See that script.
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

  loki:
    image: grafana/loki:3.3.2
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    # Reachable at https://grafana.<domain>/ via nginx below (see nginx.conf.example's
    # grafana.YOUR_DOMAIN server block). Still bound to 127.0.0.1:3000 directly too,
    # for local debugging without going through nginx.
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - prometheus

volumes:
  pgdata:
  uploads:
  loki-data:
  prometheus-data:
  grafana-data:
