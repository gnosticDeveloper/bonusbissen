name: CI
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run tests
        run: ./mvnw test -Dspring.profiles.active=test
