name: CD

on:
  push:
    branches: [ "main", "remake-frontend-to-match-demo" ]
  workflow_dispatch:

concurrency:
  group: bonusbissen-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: [ self-hosted, bonusbissen-deployment ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      # .env lives only on the VPS (gitignored, not part of the checkout) --
      # a fresh box or a wiped .env fails deep inside `docker compose up`
      # with a generic "interpolation" error that's easy to mistake for
      # something else. Catch it here instead, with a message that says
      # exactly what's missing, before touching docker at all. The required
      # var list is pulled straight from docker-compose.yml's `:?` guards so
      # it can't drift out of sync with that file.
      - name: Verify .env is present and populated
        run: |
          if [ ! -f .env ]; then
            echo "::error::.env is missing on this VPS. Copy .env.example to .env and fill in real values before deploying."
            exit 1
          fi
          set -a
          source .env
          set +a
          missing=""
          for var in $(grep -oE '\$\{[A-Z_]+:\?' docker-compose.yml | sed -E 's/\$\{([A-Z_]+):\?/\1/' | sort -u); do
            if [ -z "${!var}" ]; then
              missing="${missing} ${var}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::.env is missing required values:${missing}. Check .env.example for the full list and fill these in on the VPS."
            exit 1
          fi
          echo ".env has all required values."

          # These aren't hard-required -- the app runs fine without them,
          # just with mail/backup silently in their no-op fallback (mail
          # logged instead of sent, backup job fails harmlessly at upload
          # time). Warn instead of failing, so an intentionally-disabled
          # feature doesn't block a deploy, but an accidentally-empty one
          # doesn't go unnoticed either.
          mail_missing=""
          for var in MAIL_USERNAME MAIL_PASSWORD; do
            if [ -z "${!var}" ]; then
              mail_missing="${mail_missing} ${var}"
            fi
          done
          if [ -n "$mail_missing" ]; then
            echo "::warning::.env has no Mailgun credentials set (${mail_missing# }). Mail will fall back to logging instead of sending -- fine if that's intentional, otherwise fill these in."
          fi

          backup_missing=""
          for var in DR_BACKUP_S3_ENDPOINT DR_BACKUP_S3_BUCKET DR_BACKUP_S3_ACCESS_KEY DR_BACKUP_S3_SECRET_KEY; do
            if [ -z "${!var}" ]; then
              backup_missing="${backup_missing} ${var}"
            fi
          done
          if [ -n "$backup_missing" ]; then
            echo "::warning::.env has no backup S3 credentials set (${backup_missing# }). The nightly DB backup job will fail harmlessly at upload time -- fine if that's intentional, otherwise fill these in."
          fi

      # Keeps exactly one rollback point: the image running right before this
      # deploy. Re-tagging :latest as :previous overwrites last deploy's
      # :previous tag, so its now-untagged image is picked up by the prune
      # step below -- disk usage stays bounded to current + previous, no
      # history accumulates. `|| true` covers the very first deploy, when
      # :latest doesn't exist yet.
      - name: Tag current images as previous (rollback point)
        run: |
          docker tag bonusbissen-backend:latest bonusbissen-backend:previous || true
          docker tag bonusbissen-frontend:latest bonusbissen-frontend:previous || true

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          for service in backend frontend; do
            echo "Checking health of ${service}..."
            for attempt in $(seq 1 24); do
              status=$(docker inspect --format='{{.State.Health.Status}}' "${service}" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "${service} is healthy."
                break
              fi
              if [ "$attempt" -eq 24 ]; then
                echo "ERROR: ${service} did not become healthy in time (status: ${status})."
                docker compose logs "${service}" --tail=50
                exit 1
              fi
              sleep 5
            done
          done

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
