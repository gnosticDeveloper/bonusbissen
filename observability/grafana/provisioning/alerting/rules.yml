apiVersion: 1

groups:
  - orgId: 1
    name: bonusbissen-alerts
    folder: bonusbissen
    interval: 1m
    rules:
      - uid: backend-down
        title: Backend caído
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Backend caído
          description: "Prometheus no puede acceder al backend hace más de 5 minutos (un redeploy normal tarda menos)."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'up{job="backend"}'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
      - uid: http-5xx-rate
        title: Tasa alta de errores 5xx
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: Tasa alta de errores 5xx
          description: "Más del 5% de las solicitudes devolvieron 5xx en los últimos 5 minutos."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [5]}
      - uid: db-pool-pending
        title: Pool de conexiones a la base de datos saturado
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Pool de conexiones a la base de datos saturado
          description: "Hay hilos esperando una conexión a la base de datos hace 5 minutos."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max(hikaricp_connections_pending)'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: error-logs
        title: Tasa alta de errores en los logs
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Tasa alta de errores en los logs
          description: "Más de 10 líneas de error por minuto en los logs durante 5 minutos."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'sum(rate(logback_events_total{level="error"}[5m])) * 60'
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [10]}
