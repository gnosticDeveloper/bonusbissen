worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        # Self-signed for now (nginx/generate-self-signed-cert.sh); swap for
        # certbot-managed files under the same paths when that's wired up.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Reward images are written by the backend to a shared volume and
        # served here directly, since imagePath ("rewards/<uuid>.jpg") is
        # exposed to the browser as ASSETS_URL + imagePath.
        location ~ ^/rewards/(?<filename>[^/]+\.(?:jpg|jpeg|png|webp))$ {
            alias /uploads/rewards/$filename;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
